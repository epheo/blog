[project]
name = "blog-epheo-eu"
version = "0.1.0"
description = "Personal technical blog built with Sphinx"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "epheo", email = "root@epheo.eu"},
]
license = {text = "GNU General Public License"}

dependencies = [
    "Sphinx>=8.0.0,<9.0.0",
    "furo>=2024.8.6,<2027.0.0",
    "sphinx-design>=0.6.1,<1.0.0",
    "sphinx-sitemap>=2.6.0,<3.0.0",
    "sphinxext-opengraph>=0.10.0,<1.0.0",
    "sphinx-autobuild>=2024.10.3,<2027.0.0",
    "sphinx-copybutton>=0.5.2,<1.0.0",
    "sphinx-reredirects>=0.1.6,<1.0.0",
    "sphinxcontrib-mermaid>=1.0.0,<2.0.0",
    "sphinx-notfound-page>=1.0.0,<2.0.0",
]

# dependency spec only, nothing to build or install
[tool.uv]
package = false